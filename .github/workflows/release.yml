name: Build Artifacts

on:
  push:
    branches:
      - '26.*'
    paths:
      - 'gradle.properties'
      - '**/src/**'
      - 'build.gradle'
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract version from gradle.properties
        id: version
        run: |
          VERSION=$(grep "mod_version=" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (with retries)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: ./gradlew build --no-daemon --refresh-dependencies

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple-voice-chat-${{ steps.version.outputs.version }}
          path: |
            bukkit/build/libs/*.jar
            bungeecord/build/libs/*.jar
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar
            paper/build/libs/*.jar
            quilt/build/libs/*.jar
            velocity/build/libs/*.jar
          if-no-files-found: error
          retention-days: 90

      - name: Send Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d "{\"content\": \"🔔 **Simple Voice Chat обновлён!**\n\n✅ Версия: **v${{ steps.version.outputs.version }}**\n📦 Скачать: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n⚠️ Не забудьте обновить плагин на сервере!\"}" \
              "$DISCORD_WEBHOOK"
          fi
